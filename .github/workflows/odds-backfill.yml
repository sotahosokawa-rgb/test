name: odds-backfill
# 過去の締切時オッズ(2連単/2連複)。scripts/odds_backfill_request.txt の期間を7日単位で取得。
# 1ページ約10秒のため、7日(約1,200レース)で約4時間。1ジョブ6時間の上限に収める。
on:
  push:
    branches: [boatrace-probe]
    paths: [scripts/odds_backfill_request.txt]
permissions:
  contents: write
concurrency: odds-backfill
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      weeks: ${{ steps.m.outputs.weeks }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          s=$(grep '^start=' scripts/odds_backfill_request.txt | cut -d= -f2)
          e=$(grep '^end=' scripts/odds_backfill_request.txt | cut -d= -f2)
          ws=()
          cur="$s"
          while [[ "$cur" < "$e" || "$cur" == "$e" ]]; do
            w=$(date -d "$cur" +%Y%m%d)
            [[ -f "data/odds_final/$w.tar.age" ]] || ws+=("\"$w\"")
            cur=$(date -d "$cur +7 day" +%F)
          done
          echo "weeks=[$(IFS=,; echo "${ws[*]}")]" >> "$GITHUB_OUTPUT"
  week:
    needs: plan
    if: needs.plan.outputs.weeks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        w: ${{ fromJson(needs.plan.outputs.weeks) }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq age && pip install -q beautifulsoup4 lxml
      - name: fetch
        run: |
          w=${{ matrix.w }}
          s="${w:0:4}-${w:4:2}-${w:6:2}"; e=$(date -d "$s +6 day" +%F)
          lim=$(grep '^end=' scripts/odds_backfill_request.txt | cut -d= -f2)
          [[ "$e" > "$lim" ]] && e="$lim"
          mkdir -p tmp
          timeout 20700 python3 scripts/odds_backfill.py "$s" "$e" tmp && touch tmp/COMPLETE || true
      - name: save
        if: always()
        run: |
          w=${{ matrix.w }}
          [ -n "$(ls tmp/*.jsonl 2>/dev/null)" ] || exit 0
          n=$(cat tmp/*.jsonl | wc -l)
          gzip -9 tmp/*.jsonl
          # 最後まで取れた週だけ確定名にする。途中なら part として保存し、次回は最初から取り直す
          if [ -f tmp/COMPLETE ]; then dest="data/odds_final/$w.tar.age"; else dest="data/odds_final/part/$w-$(date +%s).tar.age"; fi
          ./scripts/pack_and_push.sh tmp "$dest" "odds_final $w ($n rows)"
