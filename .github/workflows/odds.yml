name: odds
# 締切前オッズの記録。開催時間(おおむね 08:30〜23:00 JST)を4本のジョブに分ける。
# 定時実行は15〜30分遅れることがあるので、各ジョブの担当範囲を重ねている。
on:
  schedule:
    - cron: "47 22 * * *"   # 07:47 JST 〜 13:00 締切分
    - cron: "57 2 * * *"    # 11:57 JST 〜 17:00 締切分
    - cron: "57 6 * * *"    # 15:57 JST 〜 21:00 締切分
    - cron: "57 10 * * *"   # 19:57 JST 〜 終了
  push:
    branches: [boatrace-probe]
    paths: [scripts/odds_request.txt]
permissions:
  contents: write
concurrency:
  group: odds-${{ github.run_id }}
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq age && pip install -q beautifulsoup4 lxml
      - name: poll
        run: |
          h=$(TZ=Asia/Tokyo date +%H)
          if   [ "$h" -lt 11 ]; then until=13:00
          elif [ "$h" -lt 15 ]; then until=17:00
          elif [ "$h" -lt 19 ]; then until=21:00
          else until=23:59; fi
          mkdir -p tmp
          # 保存先の名前はジョブ開始時の日付・時刻と run id で決める(同時刻に保存した別ジョブとの衝突を防ぐ)
          echo "ODDS_D=$(TZ=Asia/Tokyo date +%Y%m%d)" >> "$GITHUB_ENV"
          echo "ODDS_T=$(TZ=Asia/Tokyo date +%H%M)" >> "$GITHUB_ENV"
          # 5時間40分で打ち切り(途中までの結果も保存する)
          timeout 20400 python3 scripts/odds_poller.py tmp --until "$until" || true
          ls -la tmp
      - name: save
        if: always()
        run: |
          [ -n "$(ls tmp/*.jsonl 2>/dev/null)" ] || exit 0
          gzip -9 tmp/*.jsonl
          d=${ODDS_D:-$(TZ=Asia/Tokyo date +%Y%m%d)}; t=${ODDS_T:-$(TZ=Asia/Tokyo date +%H%M)}
          ./scripts/pack_and_push.sh tmp "data/odds/$d/${t}_${GITHUB_RUN_ID}.tar.age" "odds $d $t"
