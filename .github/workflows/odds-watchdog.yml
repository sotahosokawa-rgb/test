name: odds-watchdog
# odds ジョブの鎖(ジョブが次のジョブを起動する)が切れていたら起動し直す。
# 実行中・待機中の odds ジョブが1つもないときだけ起動するので、鎖が二重にならない。
on:
  schedule:
    - cron: "12 22 * * *"   # 07:12 JST
    - cron: "42 23 * * *"   # 08:42 JST
    - cron: "27 2 * * *"    # 11:27 JST
    - cron: "27 5 * * *"    # 14:27 JST
    - cron: "27 8 * * *"    # 17:27 JST
    - cron: "27 11 * * *"   # 20:27 JST
    - cron: "27 15 * * *"   # 00:27 JST
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          n=$(gh run list --workflow odds.yml --limit 30 --json status -q '[.[]|select(.status!="completed")]|length')
          echo "active odds runs: $n"
          if [ "$n" -eq 0 ]; then
            h=$(TZ=Asia/Tokyo date +%H)
            if [ "$h" -ge 7 ] && [ "$h" -lt 23 ]; then
              gh workflow run odds.yml --ref "${GITHUB_REF_NAME}"
            else
              gh workflow run odds.yml --ref "${GITHUB_REF_NAME}" -f start_at="$(TZ=Asia/Tokyo date -d "$( [ "$h" -ge 23 ] && echo tomorrow || echo today )" +%F)T07:40" -f from=00:00
            fi
            echo started
          fi
