name: probe
on:
  push:
    branches: [boatrace-probe]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          python3 - <<'PY' > probe_result.txt 2>&1
          import time, urllib.request
          for ua in ["Mozilla/5.0 (personal research; low rate)", "Mozilla/5.0"]:
              for d in ["170701", "170702", "170703"]:
                  url = f"https://www1.mbrace.or.jp/od2/K/201707/k{d}.lzh"
                  t = time.time()
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": ua}), timeout=30) as r:
                          n = len(r.read()); st = r.status
                  except Exception as e:
                      n = 0; st = repr(e)[:120]
                  print(f"{time.time()-t:6.2f}s {st} {n} {ua[:12]} {url}", flush=True)
                  time.sleep(1.5)
          PY
          cat probe_result.txt
      - name: save
        run: |
          git config user.name "probe-bot"; git config user.email "probe-bot@users.noreply.github.com"
          git add probe_result.txt; git commit -m "probe result 2 [skip ci]" || true
          git pull -q --rebase origin boatrace-probe; git push
