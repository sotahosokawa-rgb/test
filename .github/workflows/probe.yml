name: probe
on:
  push:
    branches: [boatrace-probe]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - name: fetch sample pages
        run: |
          mkdir -p tmp
          d=$(TZ=Asia/Tokyo date +%Y%m%d)
          # 今日の開催一覧
          curl -sS -A 'Mozilla/5.0' --max-time 60 -o tmp/index_$d.html "https://www.boatrace.jp/owpc/pc/race/index?hd=$d"; sleep 2
          for page in odds3t odds3f odds2tf oddsk oddstf beforeinfo racelist raceresult; do
            curl -sS -A 'Mozilla/5.0' --max-time 60 -w "%{http_code} %{size_download} %{time_total} $page\n" -o tmp/${page}_20250101_01_12.html "https://www.boatrace.jp/owpc/pc/race/$page?rno=12&jcd=01&hd=20250101" >> tmp/log.txt; sleep 2
          done
          cat tmp/log.txt
          cp tmp/log.txt probe_result.txt
      - name: save
        run: |
          ./scripts/pack_and_push.sh tmp data/samples/pages_$(date +%s).tar.age "sample pages"
          git add probe_result.txt; git commit -m "probe result 3 [skip ci]" || true
          git pull -q --rebase origin boatrace-probe; git push -q origin HEAD:boatrace-probe
